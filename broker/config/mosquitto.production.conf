# Production Mosquitto configuration for the Oracle deployment.
#
# This file exists alongside mosquitto.conf rather than replacing it: the bench
# config stays exactly as it is, and compose.production.yml selects this one by
# path. The ACL is shared between both, so topic authority is identical in
# development and production and cannot drift.
#
# Listener layout, tightest first:
#
#   1883  plain MQTT, bound to the container loopback only. Not reachable from
#         the Docker network or the host - it exists so the healthcheck and
#         smoke-test.sh can talk to the broker via `docker compose exec`.
#   9001  WebSockets, reachable only from the Docker network. Caddy terminates
#         TLS and reverse-proxies wss://DOMAIN/mqtt here.
#   8883  MQTT over TLS, the only broker port published to the internet. The
#         badge firmware turns TLS on purely by port number (see mqtt.cpp),
#         so 8883 is the port ESP32 clients must be given.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd.production
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Bounds on a publicly reachable broker. Badge payloads are small JSON state
# documents (the firmware's own buffer is 1 KB) and OTA transfers the image
# over HTTPS rather than MQTT, so 64 KB is generous headroom while still
# refusing an obviously abusive publish.
message_size_limit 65536
max_queued_messages 1000
max_inflight_messages 40

# A badge that reconnects on a flaky con network must not be locked out by its
# own previous session lingering. These are the defaults, pinned so a future
# edit is a deliberate decision.
max_keepalive 120
persistent_client_expiration 14d

# --- Administrative / healthcheck listener (container loopback only) --------
listener 1883 127.0.0.1
protocol mqtt

# --- Browser WebSockets, private behind Caddy -------------------------------
# Plaintext is safe here: this listener is only reachable over the internal
# Docker network, and Caddy provides the TLS the browser sees.
listener 9001 0.0.0.0
protocol websockets

# --- Native MQTT over TLS for ESP32 badges ---------------------------------
# Certificates are the same ACME material Caddy obtains, copied into a shared
# volume by the certsync sidecar. Mosquitto binds its certificate at listener
# start and does not swap it on SIGHUP, so the container's entrypoint restarts
# the broker when a renewal lands. See scripts/mosquitto-entrypoint.sh.
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

# No client certificates: badges authenticate with username/password over TLS.
require_certificate false

# TLS version is left at the library default so the broker offers both 1.2 and
# 1.3. Pinning to tlsv1.2 here would mean *only* 1.2, which needlessly limits
# browsers and modern clients; ESP32 mbedtls negotiates 1.2 against this
# happily.
