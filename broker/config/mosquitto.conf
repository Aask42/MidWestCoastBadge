per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Local badge and operator clients. Production terminates TLS at Caddy and
# forwards to this listener over the private Docker network.
listener 1883 0.0.0.0
protocol mqtt

# Local browser development. Production browsers use WSS through Caddy.
listener 9001 0.0.0.0
protocol websockets