# Fleet operator: signed commands, OTA, and complete diagnostics.
user operator
topic readwrite dc34/#
topic read $SYS/#

# Badges share transport credentials. Badge identity and command authority are
# enforced in message crypto; the broker account only limits fleet scope.
user badge
topic read dc34/all/cmd
topic read dc34/badge/+/cmd
topic read dc34/badge/+/owner
topic readwrite dc34/claim/#
topic write dc34/badge/+/state
topic write dc34/badge/+/telemetry
topic write dc34/badge/+/wifi

# This credential ships in the static site and is therefore public. It cannot
# reach operator cmd/OTA topics. Owner messages remain useless without the
# physical badge code and the resulting session key.
user web
topic readwrite dc34/claim/#
topic write dc34/badge/+/owner
topic read dc34/badge/+/state

# Container health probe only.
user health
topic read $SYS/broker/uptime